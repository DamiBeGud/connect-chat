server:
  port: ${IDENTITY_SERVICE_PORT:8081}

spring:
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5432/identity_service}
    username: ${IDENTITY_DB_USERNAME:postgres}
    password: ${IDENTITY_DB_PASSWORD:postgres}
  flyway:
    enabled: ${IDENTITY_FLYWAY_ENABLED:true}
    url: ${IDENTITY_FLYWAY_URL:${IDENTITY_DB_URL:jdbc:postgresql://localhost:5432/identity_service}}
    user: ${IDENTITY_FLYWAY_USERNAME:${IDENTITY_DB_USERNAME:postgres}}
    password: ${IDENTITY_FLYWAY_PASSWORD:${IDENTITY_DB_PASSWORD:postgres}}
identity:
  jwt:
    secret: ${IDENTITY_JWT_SECRET:connect-chat-local-jwt-secret-must-be-at-least-32-bytes}
    access-token-expiration-ms: ${IDENTITY_JWT_ACCESS_TOKEN_EXPIRATION_MS:14400000}
    refresh-token-expiration-ms: ${IDENTITY_JWT_REFRESH_TOKEN_EXPIRATION_MS:2592000000}
    service-token-expiration-ms: ${IDENTITY_JWT_SERVICE_TOKEN_EXPIRATION_MS:900000}
    issuer: ${IDENTITY_JWT_ISSUER:http://localhost:8081}
  twilio:
    account-sid: ${IDENTITY_TWILIO_ACCOUNT_SID:}
    auth-token: ${IDENTITY_TWILIO_AUTH_TOKEN:}
    from-phone-number: ${IDENTITY_TWILIO_FROM_PHONE_NUMBER:}
