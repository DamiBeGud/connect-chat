spring:
  datasource:
    url: jdbc:h2:mem:group_service;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

identity:
  service:
    base-url: http://localhost:8081

group:
  service-client:
    client-id: group-service
    client-secret: local-group-service-secret
