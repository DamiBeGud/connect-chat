spring:
  datasource:
    url: ${GROUP_DB_URL:jdbc:postgresql://postgres:5432/group_service}
    username: ${GROUP_DB_USERNAME:postgres}
    password: ${GROUP_DB_PASSWORD:postgres}
  flyway:
    enabled: ${GROUP_FLYWAY_ENABLED:true}
    url: ${GROUP_FLYWAY_URL:${GROUP_DB_URL:jdbc:postgresql://postgres:5432/group_service}}
    user: ${GROUP_FLYWAY_USERNAME:${GROUP_DB_USERNAME:postgres}}
    password: ${GROUP_FLYWAY_PASSWORD:${GROUP_DB_PASSWORD:postgres}}
