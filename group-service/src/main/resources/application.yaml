spring:
  application:
    name: group-service

group:
  service-client:
    client-id: ${GROUP_SERVICE_CLIENT_ID:group-service}
    client-secret: ${GROUP_SERVICE_CLIENT_SECRET:local-group-service-secret}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

identity:
  service:
    base-url: ${IDENTITY_SERVICE_BASE_URL:http://localhost:8081}
