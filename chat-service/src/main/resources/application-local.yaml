server:
  port: ${CHAT_SERVICE_PORT:8083}

spring:
  datasource:
    url: ${CHAT_DB_URL:jdbc:postgresql://localhost:5432/chat_service}
    username: ${CHAT_DB_USERNAME:postgres}
    password: ${CHAT_DB_PASSWORD:postgres}
  flyway:
    enabled: ${CHAT_FLYWAY_ENABLED:true}
    url: ${CHAT_FLYWAY_URL:${CHAT_DB_URL:jdbc:postgresql://localhost:5432/chat_service}}
    user: ${CHAT_FLYWAY_USERNAME:${CHAT_DB_USERNAME:postgres}}
    password: ${CHAT_FLYWAY_PASSWORD:${CHAT_DB_PASSWORD:postgres}}
  rabbitmq:
    host: ${CHAT_RABBITMQ_HOST:localhost}
    port: ${CHAT_RABBITMQ_PORT:5672}
    username: ${CHAT_RABBITMQ_USERNAME:guest}
    password: ${CHAT_RABBITMQ_PASSWORD:guest}
  cassandra:
    contact-points: ${CHAT_CASSANDRA_CONTACT_POINTS:localhost}
    port: ${CHAT_CASSANDRA_PORT:9042}
    keyspace-name: ${CHAT_CASSANDRA_KEYSPACE:connect_chat}
    local-datacenter: ${CHAT_CASSANDRA_DATACENTER:datacenter1}
    schema-action: ${CHAT_CASSANDRA_SCHEMA_ACTION:NONE}

identity:
  jwt:
    secret: ${IDENTITY_JWT_SECRET:connect-chat-local-jwt-secret-must-be-at-least-32-bytes}
    issuer: ${IDENTITY_JWT_ISSUER:http://localhost:8081}

logging:
  level:
    com.connectchat.chat.config.WebSocketAuthenticationInterceptor: DEBUG
