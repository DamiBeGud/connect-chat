spring:
  application:
    name: chat-service

chat:
  instance:
    pod-id: ${CHAT_SERVICE_INSTANCE_ID:local-chat-service-1}
    service-name: ${CHAT_SERVICE_NAME:chat-service}
  service-client:
    client-id: ${CHAT_SERVICE_CLIENT_ID:chat-service}
    client-secret: ${CHAT_SERVICE_CLIENT_SECRET:local-chat-service-secret}
  messaging:
    private-message-queue: ${CHAT_PRIVATE_MESSAGE_QUEUE:chat.private-message.queue}
    private-message-exchange: ${CHAT_PRIVATE_MESSAGE_EXCHANGE:chat.private-message.exchange}
    private-message-routing-key: ${CHAT_PRIVATE_MESSAGE_ROUTING_KEY:chat.private-message}
    status-request-queue: ${CHAT_STATUS_REQUEST_QUEUE:chat.message-status.request.queue}
    status-request-exchange: ${CHAT_STATUS_REQUEST_EXCHANGE:chat.message-status.request.exchange}
    status-request-routing-key: ${CHAT_STATUS_REQUEST_ROUTING_KEY:chat.message-status.request}
    status-confirmed-queue: ${CHAT_STATUS_CONFIRMED_QUEUE:chat.message-status.confirmed.queue}
    status-confirmed-exchange: ${CHAT_STATUS_CONFIRMED_EXCHANGE:chat.message-status.confirmed.exchange}
    status-confirmed-routing-key: ${CHAT_STATUS_CONFIRMED_ROUTING_KEY:chat.message-status.confirmed}
    private-message-listener-enabled: ${CHAT_PRIVATE_MESSAGE_LISTENER_ENABLED:false}
    outbox-batch-size: ${CHAT_OUTBOX_BATCH_SIZE:50}
    inbox-batch-size: ${CHAT_INBOX_BATCH_SIZE:50}
    outbox-processing-delay: ${CHAT_OUTBOX_PROCESSING_DELAY:1000}
    inbox-processing-delay: ${CHAT_INBOX_PROCESSING_DELAY:1000}
  websocket-delivery:
    batch-size: ${CHAT_WEBSOCKET_DELIVERY_BATCH_SIZE:50}
    processing-delay: ${CHAT_WEBSOCKET_DELIVERY_PROCESSING_DELAY:500}
    task-ttl: ${CHAT_WEBSOCKET_DELIVERY_TASK_TTL:5m}
    stale-processing-timeout: ${CHAT_WEBSOCKET_DELIVERY_STALE_PROCESSING_TIMEOUT:30s}
    cleanup-delay: ${CHAT_WEBSOCKET_DELIVERY_CLEANUP_DELAY:5000}
  offline-delivery:
    batch-size: ${CHAT_OFFLINE_DELIVERY_BATCH_SIZE:50}
    retry-delay: ${CHAT_OFFLINE_DELIVERY_RETRY_DELAY:3s}

presence:
  service:
    base-url: ${PRESENCE_SERVICE_BASE_URL:http://localhost:8085}

message-storage:
  service:
    base-url: ${MESSAGE_STORAGE_SERVICE_BASE_URL:http://localhost:8084}

identity:
  service:
    base-url: ${IDENTITY_SERVICE_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
