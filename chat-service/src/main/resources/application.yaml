spring:
  application:
    name: chat-service

chat:
  messaging:
    outbox-batch-size: ${CHAT_OUTBOX_BATCH_SIZE:50}
    inbox-batch-size: ${CHAT_INBOX_BATCH_SIZE:50}
    outbox-processing-delay: ${CHAT_OUTBOX_PROCESSING_DELAY:1000}
    inbox-processing-delay: ${CHAT_INBOX_PROCESSING_DELAY:1000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
