spring:
  datasource:
    url: ${CHAT_DB_URL:jdbc:postgresql://postgres:5432/chat_service}
    username: ${CHAT_DB_USERNAME:postgres}
    password: ${CHAT_DB_PASSWORD:postgres}
  flyway:
    enabled: ${CHAT_FLYWAY_ENABLED:true}
    url: ${CHAT_FLYWAY_URL:${CHAT_DB_URL:jdbc:postgresql://postgres:5432/chat_service}}
    user: ${CHAT_FLYWAY_USERNAME:${CHAT_DB_USERNAME:postgres}}
    password: ${CHAT_FLYWAY_PASSWORD:${CHAT_DB_PASSWORD:postgres}}
  rabbitmq:
    host: ${CHAT_RABBITMQ_HOST:rabbitmq}
    port: ${CHAT_RABBITMQ_PORT:5672}
    username: ${CHAT_RABBITMQ_USERNAME:guest}
    password: ${CHAT_RABBITMQ_PASSWORD:guest}
  cassandra:
    contact-points: ${CHAT_CASSANDRA_CONTACT_POINTS:cassandra}
    port: ${CHAT_CASSANDRA_PORT:9042}
    keyspace-name: ${CHAT_CASSANDRA_KEYSPACE:connect_chat}
    local-datacenter: ${CHAT_CASSANDRA_DATACENTER:datacenter1}
    schema-action: ${CHAT_CASSANDRA_SCHEMA_ACTION:NONE}

identity:
  service:
    base-url: ${IDENTITY_SERVICE_BASE_URL:http://identity-service:8081}

presence:
  service:
    base-url: ${PRESENCE_SERVICE_BASE_URL:http://presence-service:8085}

message-storage:
  service:
    base-url: ${MESSAGE_STORAGE_SERVICE_BASE_URL:http://message-storage-service:8084}

group:
  service:
    base-url: ${GROUP_SERVICE_BASE_URL:http://group-service:8082}
