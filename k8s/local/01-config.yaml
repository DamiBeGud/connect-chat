apiVersion: v1
kind: ConfigMap
metadata:
  name: connect-chat-config
  namespace: connect-chat
data:
  POSTGRES_USER: postgres
  POSTGRES_DB: postgres
  POSTGRES_MULTIPLE_DATABASES: identity_service,group_service,chat_service,message_storage_service

  RABBITMQ_DEFAULT_USER: guest
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: guest

  CASSANDRA_CLUSTER_NAME: connect-chat
  CASSANDRA_DC: datacenter1
  CASSANDRA_KEYSPACE: connect_chat

  IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/identity_service
  IDENTITY_DB_USERNAME: postgres
  IDENTITY_FLYWAY_ENABLED: "true"
  IDENTITY_FLYWAY_URL: jdbc:postgresql://postgres:5432/identity_service
  IDENTITY_FLYWAY_USERNAME: postgres
  IDENTITY_JWT_ACCESS_TOKEN_EXPIRATION_MS: "14400000"
  IDENTITY_JWT_REFRESH_TOKEN_EXPIRATION_MS: "2592000000"
  IDENTITY_JWT_SERVICE_TOKEN_EXPIRATION_MS: "14400000"
  IDENTITY_JWT_ISSUER: http://localhost:8081
  IDENTITY_INTERNAL_CLIENT_CHAT_SERVICE_ID: chat-service
  IDENTITY_INTERNAL_CLIENT_GROUP_SERVICE_ID: group-service
  IDENTITY_SERVICE_BASE_URL: http://identity-service:8081

  GROUP_DB_URL: jdbc:postgresql://postgres:5432/group_service
  GROUP_DB_USERNAME: postgres
  GROUP_FLYWAY_ENABLED: "true"
  GROUP_FLYWAY_URL: jdbc:postgresql://postgres:5432/group_service
  GROUP_FLYWAY_USERNAME: postgres
  GROUP_SERVICE_CLIENT_ID: group-service
  GROUP_SERVICE_BASE_URL: http://group-service:8082

  CHAT_DB_URL: jdbc:postgresql://postgres:5432/chat_service
  CHAT_DB_USERNAME: postgres
  CHAT_FLYWAY_ENABLED: "true"
  CHAT_FLYWAY_URL: jdbc:postgresql://postgres:5432/chat_service
  CHAT_FLYWAY_USERNAME: postgres
  CHAT_RABBITMQ_HOST: rabbitmq
  CHAT_RABBITMQ_PORT: "5672"
  CHAT_RABBITMQ_USERNAME: guest
  CHAT_CASSANDRA_CONTACT_POINTS: cassandra
  CHAT_CASSANDRA_PORT: "9042"
  CHAT_CASSANDRA_KEYSPACE: connect_chat
  CHAT_CASSANDRA_DATACENTER: datacenter1
  CHAT_CASSANDRA_SCHEMA_ACTION: NONE
  CHAT_SERVICE_NAME: chat-service
  CHAT_SERVICE_CLIENT_ID: chat-service
  CHAT_PRIVATE_MESSAGE_LISTENER_ENABLED: "false"
  CHAT_GROUP_MESSAGE_EXCHANGE: chat.group-message.exchange
  CHAT_GROUP_MESSAGE_ROUTING_KEY: chat.group-message
  CHAT_BOT_INBOX_EXCHANGE: chat.bot-inbox.exchange
  CHAT_BOT_INBOX_ROUTING_KEY: chat.bot-inbox
  CHAT_AI_REPLY_COMMAND_QUEUE: chat.ai-reply.commands
  CHAT_AI_REPLY_EXCHANGE: chat.ai-reply.exchange
  CHAT_AI_REPLY_ROUTING_KEY: chat.ai-reply
  CHAT_WEBSOCKET_DELIVERY_BATCH_SIZE: "50"
  CHAT_WEBSOCKET_DELIVERY_PROCESSING_DELAY: "500"
  CHAT_WEBSOCKET_DELIVERY_TASK_TTL: "5m"
  CHAT_WEBSOCKET_DELIVERY_STALE_PROCESSING_TIMEOUT: "30s"
  CHAT_WEBSOCKET_DELIVERY_CLEANUP_DELAY: "5000"
  PRESENCE_SERVICE_BASE_URL: http://presence-service:8085

  MESSAGE_STORAGE_DB_URL: jdbc:postgresql://postgres:5432/message_storage_service
  MESSAGE_STORAGE_DB_USERNAME: postgres
  MESSAGE_STORAGE_FLYWAY_ENABLED: "true"
  MESSAGE_STORAGE_FLYWAY_URL: jdbc:postgresql://postgres:5432/message_storage_service
  MESSAGE_STORAGE_FLYWAY_USERNAME: postgres
  MESSAGE_STORAGE_RABBITMQ_HOST: rabbitmq
  MESSAGE_STORAGE_RABBITMQ_PORT: "5672"
  MESSAGE_STORAGE_RABBITMQ_USERNAME: guest
  MESSAGE_STORAGE_GROUP_MESSAGE_QUEUE: message-storage.group-message.queue
  MESSAGE_STORAGE_GROUP_MESSAGE_EXCHANGE: chat.group-message.exchange
  MESSAGE_STORAGE_GROUP_MESSAGE_ROUTING_KEY: chat.group-message
  MESSAGE_STORAGE_CASSANDRA_CONTACT_POINTS: cassandra
  MESSAGE_STORAGE_CASSANDRA_PORT: "9042"
  MESSAGE_STORAGE_CASSANDRA_KEYSPACE: connect_chat
  MESSAGE_STORAGE_CASSANDRA_DATACENTER: datacenter1
  MESSAGE_STORAGE_CASSANDRA_SCHEMA_ACTION: NONE

  PRESENCE_REDIS_HOST: redis
  PRESENCE_REDIS_PORT: "6379"
  PRESENCE_REDIS_PASSWORD: ""
  PRESENCE_SESSION_TTL: "30m"

  AI_BOT_USER_ID: 00000000-0000-0000-0000-000000000001
  AI_BOT_PHONE_NUMBER: "+10000000000"
  BOT_INBOX_EXCHANGE: chat.bot-inbox.exchange
  BOT_INBOX_ROUTING_KEY: chat.bot-inbox
  BOT_INBOX_QUEUE: ai-service.bot-inbox.commands
  AI_REPLY_EXCHANGE: chat.ai-reply.exchange
  AI_REPLY_ROUTING_KEY: chat.ai-reply
  AI_REPLY_MAX_CHARS: "16000"
  GOOGLE_MODEL: gemini-3-flash
  RIDE_AND_PARK_MCP_URL: http://ride-and-park-mcp-server:8080
  AI_TOOL_TIMEOUT_SECONDS: "10"
  AI_PARKING_RESULT_LIMIT: "5"
  AI_ENABLE_RIDE_AND_PARK_TOOLS: "true"

  RIDE_AND_PARK_API_BASE_URL: http://ride-and-park-backend:3000/api
  RIDE_AND_PARK_REQUEST_TIMEOUT_SECONDS: "10"
  DEFAULT_PARKING_RADIUS_KM: "5"
  DEFAULT_PARKING_LIMIT: "5"

  RIDE_AND_PARK_BACKEND_PORT: "3000"
  RIDE_AND_PARK_CORS_ORIGIN: "*"
  PARKING_API_TIMEOUT_MS: "20000"
  PARKING_CACHE_TTL_MS: "600000"
  ALLOW_FALLBACK_DATA: "true"
  GEOCODING_USER_AGENT: RideAndPark/1.0 connect-chat-local
