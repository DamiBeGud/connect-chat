apiVersion: v1
kind: Secret
metadata:
  name: connect-chat-secret
  namespace: connect-chat
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgres
  IDENTITY_DB_PASSWORD: postgres
  IDENTITY_FLYWAY_PASSWORD: postgres
  GROUP_DB_PASSWORD: postgres
  GROUP_FLYWAY_PASSWORD: postgres
  CHAT_DB_PASSWORD: postgres
  CHAT_FLYWAY_PASSWORD: postgres
  MESSAGE_STORAGE_DB_PASSWORD: postgres
  MESSAGE_STORAGE_FLYWAY_PASSWORD: postgres

  RABBITMQ_DEFAULT_PASS: guest
  RABBITMQ_PASSWORD: guest
  CHAT_RABBITMQ_PASSWORD: guest
  MESSAGE_STORAGE_RABBITMQ_PASSWORD: guest

  IDENTITY_JWT_SECRET: connect-chat-local-jwt-secret-must-be-at-least-32-bytes
  IDENTITY_INTERNAL_CLIENT_CHAT_SERVICE_SECRET: local-chat-service-secret
  IDENTITY_INTERNAL_CLIENT_GROUP_SERVICE_SECRET: local-group-service-secret
  GROUP_SERVICE_CLIENT_SECRET: local-group-service-secret
  CHAT_SERVICE_CLIENT_SECRET: local-chat-service-secret

  IDENTITY_TWILIO_ACCOUNT_SID: ""
  IDENTITY_TWILIO_AUTH_TOKEN: ""
  IDENTITY_TWILIO_FROM_PHONE_NUMBER: ""
