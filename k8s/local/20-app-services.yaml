apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: connect-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
      containers:
        - name: identity-service
          image: connect-chat/identity-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: connect-chat-config
            - secretRef:
                name: connect-chat-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: connect-chat
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: identity-service
  ports:
    - name: http
      port: 8081
      targetPort: http
---
