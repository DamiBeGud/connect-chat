apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: connect-chat
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: chat-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chat-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done
        - name: wait-for-cassandra
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z cassandra 9042; do echo waiting for cassandra; sleep 5; done
      containers:
        - name: chat-service
          image: connect-chat/chat-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CHAT_SERVICE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: connect-chat-config
            - secretRef:
                name: connect-chat-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: connect-chat
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: chat-service
  ports:
    - name: http
      port: 8083
      targetPort: http
      nodePort: 30083
---
