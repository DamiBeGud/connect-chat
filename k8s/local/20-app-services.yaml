apiVersion: apps/v1
kind: Deployment
metadata:
  name: ride-and-park-backend
  namespace: connect-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ride-and-park-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ride-and-park-backend
    spec:
      containers:
        - name: ride-and-park-backend
          image: connect-chat/ride-and-park-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: connect-chat-config
                  key: RIDE_AND_PARK_BACKEND_PORT
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: connect-chat-config
                  key: RIDE_AND_PARK_CORS_ORIGIN
          envFrom:
            - configMapRef:
                name: connect-chat-config
            - secretRef:
                name: connect-chat-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ride-and-park-backend
  namespace: connect-chat
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ride-and-park-backend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ride-and-park-mcp-server
  namespace: connect-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ride-and-park-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ride-and-park-mcp-server
    spec:
      initContainers:
        - name: wait-for-ride-and-park-backend
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z ride-and-park-backend 3000; do echo waiting for ride-and-park-backend; sleep 2; done
      containers:
        - name: ride-and-park-mcp-server
          image: connect-chat/ride-and-park-mcp-server:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: connect-chat-config
            - secretRef:
                name: connect-chat-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
