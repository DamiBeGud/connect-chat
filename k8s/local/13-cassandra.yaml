apiVersion: v1
kind: ConfigMap
metadata:
  name: cassandra-init-scripts
  namespace: connect-chat
data:
  create-keyspace-and-tables.sh: |
    #!/bin/sh
    set -eu

    until cqlsh cassandra 9042 -e "DESCRIBE KEYSPACES" >/dev/null 2>&1; do
      echo "Waiting for Cassandra..."
      sleep 5
    done

    echo "Ensuring Cassandra keyspace and tables exist: ${CASSANDRA_KEYSPACE}"
    cqlsh cassandra 9042 <<-EOSQL
      CREATE KEYSPACE IF NOT EXISTS ${CASSANDRA_KEYSPACE}
      WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};

      CREATE TABLE IF NOT EXISTS ${CASSANDRA_KEYSPACE}.messages_by_id (
        message_id uuid PRIMARY KEY,
        source_inbox_message_id uuid,
        sender_id uuid,
        recipient_id uuid,
        content text,
        status text,
        sent_at timestamp,
        updated_at timestamp
      );
    EOSQL
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cassandra-data
  namespace: connect-chat
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cassandra
  namespace: connect-chat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cassandra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cassandra
    spec:
      containers:
        - name: cassandra
          image: cassandra:5.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: cql
              containerPort: 9042
          env:
            - name: CASSANDRA_CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: connect-chat-config
                  key: CASSANDRA_CLUSTER_NAME
            - name: CASSANDRA_DC
              valueFrom:
                configMapKeyRef:
                  name: connect-chat-config
                  key: CASSANDRA_DC
            - name: MAX_HEAP_SIZE
              value: 512M
            - name: HEAP_NEWSIZE
              value: 128M
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - cqlsh -e 'DESCRIBE KEYSPACES'
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - cqlsh -e 'DESCRIBE KEYSPACES'
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 10
          volumeMounts:
            - name: cassandra-data
              mountPath: /var/lib/cassandra
      volumes:
        - name: cassandra-data
          persistentVolumeClaim:
            claimName: cassandra-data
---
apiVersion: v1
kind: Service
metadata:
  name: cassandra
  namespace: connect-chat
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cassandra
  ports:
    - name: cql
      port: 9042
      targetPort: cql
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cassandra-init
  namespace: connect-chat
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: cassandra-init
          image: cassandra:5.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /init/create-keyspace-and-tables.sh
          env:
            - name: CASSANDRA_KEYSPACE
              valueFrom:
                configMapKeyRef:
                  name: connect-chat-config
                  key: CASSANDRA_KEYSPACE
          volumeMounts:
            - name: cassandra-init-scripts
              mountPath: /init/create-keyspace-and-tables.sh
              subPath: create-keyspace-and-tables.sh
              readOnly: true
      volumes:
        - name: cassandra-init-scripts
          configMap:
            name: cassandra-init-scripts
            defaultMode: 0755

