spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/message_storage_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    url: ${FLYWAY_URL:${DB_URL:jdbc:postgresql://postgres:5432/message_storage_service}}
    user: ${FLYWAY_USERNAME:${DB_USERNAME:postgres}}
    password: ${FLYWAY_PASSWORD:${DB_PASSWORD:postgres}}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  cassandra:
    contact-points: ${CASSANDRA_CONTACT_POINTS:cassandra}
    port: ${CASSANDRA_PORT:9042}
    keyspace-name: ${CASSANDRA_KEYSPACE:connect_chat}
    local-datacenter: ${CASSANDRA_DATACENTER:datacenter1}
    schema-action: ${CASSANDRA_SCHEMA_ACTION:NONE}
