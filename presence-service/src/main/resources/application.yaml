spring:
  application:
    name: presence-service

presence:
  session:
    ttl: ${PRESENCE_SESSION_TTL:30m}

identity:
  service:
    base-url: ${IDENTITY_SERVICE_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
