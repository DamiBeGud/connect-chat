services:
  postgres:
    image: postgres:16
    container_name: connect-chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DEFAULT_DB}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./.infra/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DEFAULT_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: connect-chat-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_HOST_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:7-alpine
    container_name: connect-chat-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  cassandra:
    image: cassandra:5.0
    container_name: connect-chat-cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: connect-chat
      CASSANDRA_DC: ${CHAT_CASSANDRA_DATACENTER}
    ports:
      - "${CASSANDRA_HOST_PORT}:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15

  cassandra-init:
    image: cassandra:5.0
    container_name: connect-chat-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    environment:
      CASSANDRA_KEYSPACE: ${CHAT_CASSANDRA_KEYSPACE}
      CASSANDRA_DATACENTER: ${CHAT_CASSANDRA_DATACENTER}
    entrypoint:
      - /bin/sh
      - /init/create-keyspace.sh
    volumes:
      - ./.infra/cassandra/create-keyspace.sh:/init/create-keyspace.sh:ro

  rabbitmq:
    image: rabbitmq:3-management
    container_name: connect-chat-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${CHAT_RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${CHAT_RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_HOST_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  cassandra_data:
  rabbitmq_data:
